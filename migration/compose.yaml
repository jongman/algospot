name: algospot-migration

services:
  postgres:
    image: postgres:17.10-bookworm
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER:-algospot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - restore
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d postgres
      interval: 2s
      timeout: 5s
      retries: 30

  restore:
    image: postgres:17.10-bookworm
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-algospot}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    networks:
      - restore
    volumes:
      - type: bind
        source: ${ALGOSPOT_BACKUP_DIR:?set ALGOSPOT_BACKUP_DIR in .env}
        target: /backup
        read_only: true
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        dropdb --if-exists algospot_restore
        createdb algospot_restore
        psql --dbname=algospot_restore --command='DROP SCHEMA public;'
        pg_restore \
          --exit-on-error \
          --no-owner \
          --no-acl \
          --dbname=algospot_restore \
          /backup/algospot.pgdump
        psql --dbname=algospot_restore --command='ANALYZE;'

  legacy-web: &legacy-web
    profiles: [legacy]
    image: algospot-legacy:local
    build:
      context: ..
      dockerfile: migration/legacy/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment: &legacy-environment
      DJANGO_SETTINGS_MODULE: algospot.legacy_settings
      PYTHONPATH: /app/www
      LEGACY_SECRET_KEY: ${LEGACY_SECRET_KEY:?set LEGACY_SECRET_KEY in legacy.env}
      LEGACY_POSTGRES_DB: algospot_restore
      LEGACY_POSTGRES_HOST: postgres
      LEGACY_POSTGRES_PORT: "5432"
      LEGACY_POSTGRES_USER: ${LEGACY_POSTGRES_USER:-algospot_legacy_ro}
      LEGACY_POSTGRES_PASSWORD: ${LEGACY_POSTGRES_PASSWORD:?set LEGACY_POSTGRES_PASSWORD in legacy.env}
    volumes:
      - type: bind
        source: ${ALGOSPOT_REPO_DIR:?set ALGOSPOT_REPO_DIR in legacy.env}/www
        target: /app/www
        read_only: true
      - type: bind
        source: ${ALGOSPOT_SNAPSHOT_DIR:?set ALGOSPOT_SNAPSHOT_DIR in legacy.env}/files/www-media
        target: /www-media
        read_only: true
      - type: bind
        source: ${ALGOSPOT_SNAPSHOT_DIR:?set ALGOSPOT_SNAPSHOT_DIR in legacy.env}/files/whoosh_index
        target: /whoosh-archive
        read_only: true
    networks:
      - restore
    user: ${LEGACY_UID:?set LEGACY_UID in legacy.env}:${LEGACY_GID:?set LEGACY_GID in legacy.env}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /whoosh_index:size=256m,mode=0700,uid=${LEGACY_UID:?set LEGACY_UID in legacy.env},gid=${LEGACY_GID:?set LEGACY_GID in legacy.env}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 1g
    cpus: 1.0
    init: true
    restart: "no"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()
      interval: 5s
      timeout: 3s
      retries: 24

  legacy-smoke: &legacy-smoke
    profiles: [legacy]
    image: algospot-legacy:local
    depends_on:
      legacy-web:
        condition: service_healthy
    environment:
      ALGOSPOT_SMOKE_BASE_URL: http://legacy-web:8000
    volumes:
      - type: bind
        source: ${ALGOSPOT_REPO_DIR:?set ALGOSPOT_REPO_DIR in legacy.env}/migration/legacy/smoke.py
        target: /opt/algospot/smoke.py
        read_only: true
    networks:
      - restore
    user: ${LEGACY_UID:?set LEGACY_UID in legacy.env}:${LEGACY_GID:?set LEGACY_GID in legacy.env}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.5
    restart: "no"
    entrypoint: [python, /opt/algospot/smoke.py]

  legacy-auth-smoke: &legacy-auth-smoke
    profiles: [legacy]
    image: algospot-legacy:local
    depends_on:
      legacy-web:
        condition: service_healthy
    environment: *legacy-environment
    volumes:
      - type: bind
        source: ${ALGOSPOT_REPO_DIR:?set ALGOSPOT_REPO_DIR in legacy.env}/www
        target: /app/www
        read_only: true
      - type: bind
        source: ${ALGOSPOT_REPO_DIR:?set ALGOSPOT_REPO_DIR in legacy.env}/migration/legacy/auth_smoke.py
        target: /opt/algospot/auth_smoke.py
        read_only: true
      - type: bind
        source: ${ALGOSPOT_SNAPSHOT_DIR:?set ALGOSPOT_SNAPSHOT_DIR in legacy.env}/files/www-media
        target: /www-media
        read_only: true
    networks:
      - restore
    user: ${LEGACY_UID:?set LEGACY_UID in legacy.env}:${LEGACY_GID:?set LEGACY_GID in legacy.env}
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 256m
    cpus: 0.5
    restart: "no"
    entrypoint: [python, /opt/algospot/auth_smoke.py]

  legacy-loopback: &loopback-proxy
    profiles: [legacy]
    image: python:3.13.5-slim-bookworm@sha256:4c2cf9917bd1cbacc5e9b07320025bdb7cdf2df7b0ceaccb55e9dd7e30987419
    depends_on:
      legacy-web:
        condition: service_healthy
    environment:
      FORWARD_HOST: legacy-web
      FORWARD_PORT: "8000"
    volumes:
      - type: bind
        source: ${ALGOSPOT_REPO_DIR:?set ALGOSPOT_REPO_DIR in legacy.env}/migration/modern/loopback_proxy.py
        target: /opt/algospot/loopback_proxy.py
        read_only: true
    networks:
      - restore
      - loopback
    ports:
      - 127.0.0.1:${LEGACY_HTTP_PORT:-18080}:8000
    user: ${LEGACY_UID:?set LEGACY_UID in legacy.env}:${LEGACY_GID:?set LEGACY_GID in legacy.env}
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.25
    init: true
    restart: "no"
    entrypoint: [python, /opt/algospot/loopback_proxy.py]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; s=socket.create_connection(('legacy-web',8000),2); s.close()
      interval: 5s
      timeout: 3s
      retries: 24

  bridge-web:
    <<: *legacy-web
    profiles: [bridge]
    image: algospot-bridge-django17:local
    build:
      context: ..
      dockerfile: migration/legacy/Dockerfile
      args:
        DJANGO_VERSION: 1.7.11
    environment:
      <<: *legacy-environment
      DJANGO_SETTINGS_MODULE: algospot.bridge_settings
    ports:
      - 127.0.0.1:${BRIDGE_HTTP_PORT:-18081}:8000
    command: [python, /opt/algospot/bridge-runserver.py]

  bridge-smoke:
    <<: *legacy-smoke
    profiles: [bridge]
    image: algospot-bridge-django17:local
    depends_on:
      bridge-web:
        condition: service_healthy
    environment:
      ALGOSPOT_SMOKE_BASE_URL: http://bridge-web:8000
      ALGOSPOT_SMOKE_HOST: legacy-web:8000

  bridge-auth-smoke:
    <<: *legacy-auth-smoke
    profiles: [bridge]
    image: algospot-bridge-django17:local
    depends_on:
      bridge-web:
        condition: service_healthy
    environment:
      <<: *legacy-environment
      DJANGO_SETTINGS_MODULE: algospot.bridge_settings

  django18-web: &django18-web
    <<: *legacy-web
    profiles: [django18]
    image: algospot-bridge-django18:local
    build:
      context: ..
      dockerfile: migration/legacy/Dockerfile
      args:
        COMMENTS_VERSION: 1.8.0
        DJANGO_VERSION: 1.8.19
        GUARDIAN_VERSION: 1.3.2
        HAYSTACK_VERSION: 2.4.1
        TAGGING_VERSION: 0.3.6
    environment:
      <<: *legacy-environment
      DJANGO_SETTINGS_MODULE: algospot.django18_settings
    ports:
      - 127.0.0.1:${DJANGO18_HTTP_PORT:-18082}:8000
    command: [python, /opt/algospot/bridge-runserver.py]

  django18-smoke: &django18-smoke
    <<: *legacy-smoke
    profiles: [django18]
    image: algospot-bridge-django18:local
    depends_on:
      django18-web:
        condition: service_healthy
    environment:
      ALGOSPOT_SMOKE_BASE_URL: http://django18-web:8000
      ALGOSPOT_SMOKE_HOST: legacy-web:8000

  django18-auth-smoke: &django18-auth-smoke
    <<: *legacy-auth-smoke
    profiles: [django18]
    image: algospot-bridge-django18:local
    depends_on:
      django18-web:
        condition: service_healthy
    environment:
      <<: *legacy-environment
      DJANGO_SETTINGS_MODULE: algospot.django18_settings

  django19-web: &django19-web
    <<: *django18-web
    profiles: [django19]
    image: algospot-bridge-django19:local
    build:
      context: ..
      dockerfile: migration/legacy/Dockerfile
      args:
        APPCONF_VERSION: 1.0.2
        COMMENTS_VERSION: 1.8.0
        DJANGO_VERSION: 1.9.13
        GUARDIAN_VERSION: 1.3.2
        HAYSTACK_VERSION: 2.5.1
        TAGGING_VERSION: 0.4.5
    environment:
      <<: *legacy-environment
      DJANGO_SETTINGS_MODULE: algospot.django19_settings
    ports:
      - 127.0.0.1:${DJANGO19_HTTP_PORT:-18084}:8000

  django19-smoke: &django19-smoke
    <<: *django18-smoke
    profiles: [django19]
    image: algospot-bridge-django19:local
    depends_on:
      django19-web:
        condition: service_healthy
    environment:
      ALGOSPOT_SMOKE_BASE_URL: http://django19-web:8000
      ALGOSPOT_SMOKE_HOST: legacy-web:8000

  django19-auth-smoke: &django19-auth-smoke
    <<: *django18-auth-smoke
    profiles: [django19]
    image: algospot-bridge-django19:local
    depends_on:
      django19-web:
        condition: service_healthy
    environment:
      <<: *legacy-environment
      DJANGO_SETTINGS_MODULE: algospot.django19_settings

  django110-web:
    <<: *django19-web
    profiles: [django110]
    image: algospot-bridge-django110:local
    build:
      context: ..
      dockerfile: migration/legacy/Dockerfile
      args:
        APPCONF_VERSION: 1.0.2
        AVATAR_VERSION: 3.1.0
        COMMENTS_VERSION: 1.8.0
        DJANGO_VERSION: 1.10.8
        GUARDIAN_VERSION: 1.4.9
        HAYSTACK_VERSION: 2.6.1
        TAGGING_VERSION: 0.4.5
    environment:
      <<: *legacy-environment
      DJANGO_SETTINGS_MODULE: algospot.django110_settings
    ports:
      - 127.0.0.1:${DJANGO110_HTTP_PORT:-18085}:8000

  django110-smoke:
    <<: *django19-smoke
    profiles: [django110]
    image: algospot-bridge-django110:local
    depends_on:
      django110-web:
        condition: service_healthy
    environment:
      ALGOSPOT_SMOKE_BASE_URL: http://django110-web:8000
      ALGOSPOT_SMOKE_HOST: legacy-web:8000

  django110-auth-smoke:
    <<: *django19-auth-smoke
    profiles: [django110]
    image: algospot-bridge-django110:local
    depends_on:
      django110-web:
        condition: service_healthy
    environment:
      <<: *legacy-environment
      DJANGO_SETTINGS_MODULE: algospot.django110_settings

  django111-web: &django111-web
    <<: *django19-web
    profiles: [django111]
    image: algospot-bridge-django111:local
    build:
      context: ..
      dockerfile: migration/legacy/Dockerfile
      args:
        APPCONF_VERSION: 1.0.2
        AVATAR_VERSION: 3.1.0
        COMMENTS_VERSION: 1.8.0
        DJANGO_VERSION: 1.11.29
        GUARDIAN_VERSION: 1.4.9
        HAYSTACK_VERSION: 2.8.1
        TAGGING_VERSION: 0.4.5
    environment:
      <<: *legacy-environment
      DJANGO_SETTINGS_MODULE: algospot.django111_settings
    ports:
      - 127.0.0.1:${DJANGO111_HTTP_PORT:-18086}:8000

  django111-smoke:
    <<: *django19-smoke
    profiles: [django111]
    image: algospot-bridge-django111:local
    depends_on:
      django111-web:
        condition: service_healthy
    environment:
      ALGOSPOT_SMOKE_BASE_URL: http://django111-web:8000
      ALGOSPOT_SMOKE_HOST: legacy-web:8000

  django111-auth-smoke:
    <<: *django19-auth-smoke
    profiles: [django111]
    image: algospot-bridge-django111:local
    depends_on:
      django111-web:
        condition: service_healthy
    environment:
      <<: *legacy-environment
      DJANGO_SETTINGS_MODULE: algospot.django111_settings

  modern-web: &modern-web
    <<: *legacy-web
    profiles: [modern]
    image: algospot-modern:local
    build:
      context: ..
      dockerfile: migration/modern/Dockerfile
    environment:
      <<: *legacy-environment
      DJANGO_SETTINGS_MODULE: algospot.modern_settings

  modern-loopback:
    <<: *loopback-proxy
    profiles: [modern]
    depends_on:
      modern-web:
        condition: service_healthy
    environment:
      FORWARD_HOST: modern-web
      FORWARD_PORT: "8000"
    ports:
      - 127.0.0.1:${MODERN_HTTP_PORT:-18090}:8000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; s=socket.create_connection(('modern-web',8000),2); s.close()
      interval: 5s
      timeout: 3s
      retries: 24

  modern-smoke:
    <<: *legacy-smoke
    profiles: [modern]
    image: algospot-modern:local
    depends_on:
      modern-web:
        condition: service_healthy
    environment:
      ALGOSPOT_SMOKE_BASE_URL: http://modern-web:8000
      ALGOSPOT_SMOKE_HOST: legacy-web:8000

  modern-auth-smoke:
    <<: *legacy-auth-smoke
    profiles: [modern]
    image: algospot-modern:local
    depends_on:
      modern-web:
        condition: service_healthy
    environment:
      <<: *legacy-environment
      DJANGO_SETTINGS_MODULE: algospot.modern_settings

  modern-scratch-web: &modern-scratch-web
    <<: *modern-web
    profiles: [tools]
    environment: &modern-scratch-environment
      <<: *legacy-environment
      DJANGO_SETTINGS_MODULE: algospot.modern_settings
      LEGACY_POSTGRES_DB: algospot_native_migrate
      LEGACY_POSTGRES_USER: ${POSTGRES_USER:-algospot}
      LEGACY_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in restore.env}
      MODERN_ALLOW_DATABASE_WRITES: scratch-only

  modern-scratch-loopback:
    <<: *loopback-proxy
    profiles: [tools]
    depends_on:
      modern-scratch-web:
        condition: service_healthy
    environment:
      FORWARD_HOST: modern-scratch-web
      FORWARD_PORT: "8000"
    ports:
      - 127.0.0.1:${MODERN_SCRATCH_HTTP_PORT:-18091}:8000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; s=socket.create_connection(('modern-scratch-web',8000),2); s.close()
      interval: 5s
      timeout: 3s
      retries: 24

  modern-scratch-smoke:
    <<: *legacy-smoke
    profiles: [tools]
    image: algospot-modern:local
    depends_on:
      modern-scratch-web:
        condition: service_healthy
    environment:
      ALGOSPOT_SMOKE_BASE_URL: http://modern-scratch-web:8000
      ALGOSPOT_SMOKE_HOST: legacy-web:8000

  modern-scratch-auth-smoke:
    <<: *legacy-auth-smoke
    profiles: [tools]
    image: algospot-modern:local
    depends_on:
      modern-scratch-web:
        condition: service_healthy
    environment:
      <<: *modern-scratch-environment
      # The server may write only while rehearsing migrations. Behavioral
      # verification reconnects to the migrated scratch DB in read-only mode.
      MODERN_ALLOW_DATABASE_WRITES: ""

  modern-migrate:
    <<: *modern-scratch-web
    profiles: [tools]
    ports: []
    restart: "no"
    entrypoint: [python, manage.py, migrate]
    command: [--fake-initial, --noinput]

  django18-scratch-web:
    <<: *django18-web
    profiles: [tools]
    environment:
      <<: *legacy-environment
      DJANGO_SETTINGS_MODULE: algospot.django18_settings
      LEGACY_POSTGRES_DB: algospot_native_migrate
      LEGACY_POSTGRES_USER: ${POSTGRES_USER:-algospot}
      LEGACY_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in restore.env}
    ports:
      - 127.0.0.1:${DJANGO18_SCRATCH_HTTP_PORT:-18083}:8000

  django18-scratch-smoke:
    <<: *django18-smoke
    profiles: [tools]
    depends_on:
      django18-scratch-web:
        condition: service_healthy
    environment:
      ALGOSPOT_SMOKE_BASE_URL: http://django18-scratch-web:8000
      ALGOSPOT_SMOKE_HOST: legacy-web:8000

  django18-scratch-auth-smoke:
    <<: *django18-auth-smoke
    profiles: [tools]
    depends_on:
      django18-scratch-web:
        condition: service_healthy
    environment:
      <<: *legacy-environment
      DJANGO_SETTINGS_MODULE: algospot.django18_settings
      LEGACY_POSTGRES_DB: algospot_native_migrate
      LEGACY_POSTGRES_USER: ${POSTGRES_USER:-algospot}
      LEGACY_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in restore.env}

  bridge-clone:
    profiles: [tools]
    image: postgres:17.10-bookworm
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-algospot}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in restore.env}
    networks:
      - restore
    restart: "no"
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        dropdb --if-exists algospot_native_migrate
        createdb algospot_native_migrate
        pg_dump --no-owner --no-acl algospot_restore |
          psql --quiet --set ON_ERROR_STOP=on \
            --dbname algospot_native_migrate >/dev/null

  bridge-migrate:
    profiles: [tools]
    image: algospot-bridge-django17:local
    build:
      context: ..
      dockerfile: migration/legacy/Dockerfile
      args:
        DJANGO_VERSION: 1.7.11
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: algospot.bridge_settings
      PYTHONPATH: /app/www
      LEGACY_SECRET_KEY: ${LEGACY_SECRET_KEY:?set LEGACY_SECRET_KEY in legacy.env}
      LEGACY_POSTGRES_DB: algospot_native_migrate
      LEGACY_POSTGRES_HOST: postgres
      LEGACY_POSTGRES_PORT: "5432"
      LEGACY_POSTGRES_USER: ${POSTGRES_USER:-algospot}
      LEGACY_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in restore.env}
      BRIDGE_ALLOW_DATABASE_WRITES: scratch-only
    volumes:
      - type: bind
        source: ${ALGOSPOT_REPO_DIR:?set ALGOSPOT_REPO_DIR in legacy.env}/www
        target: /app/www
        read_only: true
    networks:
      - restore
    user: ${LEGACY_UID:?set LEGACY_UID in legacy.env}:${LEGACY_GID:?set LEGACY_GID in legacy.env}
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 512m
    cpus: 1.0
    restart: "no"
    entrypoint: [python, manage.py, migrate]
    command: [--fake, --no-initial-data, --noinput]

  django18-migrate:
    profiles: [tools]
    image: algospot-bridge-django18:local
    build:
      context: ..
      dockerfile: migration/legacy/Dockerfile
      args:
        COMMENTS_VERSION: 1.8.0
        DJANGO_VERSION: 1.8.19
        GUARDIAN_VERSION: 1.3.2
        HAYSTACK_VERSION: 2.4.1
        TAGGING_VERSION: 0.3.6
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: algospot.django18_settings
      PYTHONPATH: /app/www
      LEGACY_SECRET_KEY: ${LEGACY_SECRET_KEY:?set LEGACY_SECRET_KEY in legacy.env}
      LEGACY_POSTGRES_DB: algospot_native_migrate
      LEGACY_POSTGRES_HOST: postgres
      LEGACY_POSTGRES_PORT: "5432"
      LEGACY_POSTGRES_USER: ${POSTGRES_USER:-algospot}
      LEGACY_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in restore.env}
      BRIDGE_ALLOW_DATABASE_WRITES: scratch-only
    volumes:
      - type: bind
        source: ${ALGOSPOT_REPO_DIR:?set ALGOSPOT_REPO_DIR in legacy.env}/www
        target: /app/www
        read_only: true
    networks:
      - restore
    user: ${LEGACY_UID:?set LEGACY_UID in legacy.env}:${LEGACY_GID:?set LEGACY_GID in legacy.env}
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 512m
    cpus: 1.0
    restart: "no"
    entrypoint: [python, manage.py, migrate]
    command: [--fake-initial, --noinput]

volumes:
  postgres-data:

networks:
  restore:
    internal: true
  loopback:
    driver: bridge
    driver_opts:
      # The proxy can accept DNAT traffic from 127.0.0.1, but packets from
      # containers on this network are not masqueraded onto the host network.
      com.docker.network.bridge.enable_ip_masquerade: "false"
