name: algospot-migration

services:
  postgres:
    image: postgres:17.10-bookworm
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER:-algospot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - restore
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d postgres
      interval: 2s
      timeout: 5s
      retries: 30

  restore:
    image: postgres:17.10-bookworm
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-algospot}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    networks:
      - restore
    volumes:
      - type: bind
        source: ${ALGOSPOT_BACKUP_DIR:?set ALGOSPOT_BACKUP_DIR in .env}
        target: /backup
        read_only: true
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        dropdb --if-exists algospot_restore
        createdb algospot_restore
        psql --dbname=algospot_restore --command='DROP SCHEMA public;'
        pg_restore \
          --exit-on-error \
          --no-owner \
          --no-acl \
          --dbname=algospot_restore \
          /backup/algospot.pgdump
        psql --dbname=algospot_restore --command='ANALYZE;'

  legacy-web:
    profiles: [legacy]
    image: algospot-legacy:local
    build:
      context: ..
      dockerfile: migration/legacy/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: algospot.legacy_settings
      PYTHONPATH: /app/www
      LEGACY_SECRET_KEY: ${LEGACY_SECRET_KEY:?set LEGACY_SECRET_KEY in legacy.env}
      LEGACY_POSTGRES_DB: algospot_restore
      LEGACY_POSTGRES_HOST: postgres
      LEGACY_POSTGRES_PORT: "5432"
      LEGACY_POSTGRES_USER: ${LEGACY_POSTGRES_USER:-algospot_legacy_ro}
      LEGACY_POSTGRES_PASSWORD: ${LEGACY_POSTGRES_PASSWORD:?set LEGACY_POSTGRES_PASSWORD in legacy.env}
    volumes:
      - type: bind
        source: ${ALGOSPOT_REPO_DIR:?set ALGOSPOT_REPO_DIR in legacy.env}/www
        target: /app/www
        read_only: true
      - type: bind
        source: ${ALGOSPOT_SNAPSHOT_DIR:?set ALGOSPOT_SNAPSHOT_DIR in legacy.env}/files/www-media
        target: /www-media
        read_only: true
      - type: bind
        source: ${ALGOSPOT_SNAPSHOT_DIR:?set ALGOSPOT_SNAPSHOT_DIR in legacy.env}/files/whoosh_index
        target: /whoosh-archive
        read_only: true
    networks:
      - restore
    ports:
      - 127.0.0.1:${LEGACY_HTTP_PORT:-18080}:8000
    user: ${LEGACY_UID:?set LEGACY_UID in legacy.env}:${LEGACY_GID:?set LEGACY_GID in legacy.env}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /whoosh_index:size=256m,mode=0700,uid=${LEGACY_UID:?set LEGACY_UID in legacy.env},gid=${LEGACY_GID:?set LEGACY_GID in legacy.env}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 1g
    cpus: 1.0
    init: true
    restart: "no"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()
      interval: 5s
      timeout: 3s
      retries: 24

  legacy-smoke:
    profiles: [legacy]
    image: algospot-legacy:local
    depends_on:
      legacy-web:
        condition: service_healthy
    environment:
      ALGOSPOT_SMOKE_BASE_URL: http://legacy-web:8000
    volumes:
      - type: bind
        source: ${ALGOSPOT_REPO_DIR:?set ALGOSPOT_REPO_DIR in legacy.env}/migration/legacy/smoke.py
        target: /opt/algospot/smoke.py
        read_only: true
    networks:
      - restore
    user: ${LEGACY_UID:?set LEGACY_UID in legacy.env}:${LEGACY_GID:?set LEGACY_GID in legacy.env}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.5
    restart: "no"
    entrypoint: [python, /opt/algospot/smoke.py]

  legacy-auth-smoke:
    profiles: [legacy]
    image: algospot-legacy:local
    depends_on:
      legacy-web:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: algospot.legacy_settings
      PYTHONPATH: /app/www
      LEGACY_SECRET_KEY: ${LEGACY_SECRET_KEY:?set LEGACY_SECRET_KEY in legacy.env}
      LEGACY_POSTGRES_DB: algospot_restore
      LEGACY_POSTGRES_HOST: postgres
      LEGACY_POSTGRES_PORT: "5432"
      LEGACY_POSTGRES_USER: ${LEGACY_POSTGRES_USER:-algospot_legacy_ro}
      LEGACY_POSTGRES_PASSWORD: ${LEGACY_POSTGRES_PASSWORD:?set LEGACY_POSTGRES_PASSWORD in legacy.env}
    volumes:
      - type: bind
        source: ${ALGOSPOT_REPO_DIR:?set ALGOSPOT_REPO_DIR in legacy.env}/www
        target: /app/www
        read_only: true
      - type: bind
        source: ${ALGOSPOT_REPO_DIR:?set ALGOSPOT_REPO_DIR in legacy.env}/migration/legacy/auth_smoke.py
        target: /opt/algospot/auth_smoke.py
        read_only: true
      - type: bind
        source: ${ALGOSPOT_SNAPSHOT_DIR:?set ALGOSPOT_SNAPSHOT_DIR in legacy.env}/files/www-media
        target: /www-media
        read_only: true
    networks:
      - restore
    user: ${LEGACY_UID:?set LEGACY_UID in legacy.env}:${LEGACY_GID:?set LEGACY_GID in legacy.env}
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 256m
    cpus: 0.5
    restart: "no"
    entrypoint: [python, /opt/algospot/auth_smoke.py]

volumes:
  postgres-data:

networks:
  restore:
    internal: true
